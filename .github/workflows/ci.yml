name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  compiler: g++,     cc: gcc,   cxx: g++ }
          - { os: ubuntu-latest,  compiler: clang++, cc: clang, cxx: clang++ }
          - { os: macos-latest,   compiler: clang++, cc: clang, cxx: clang++ }
          - { os: windows-latest, compiler: msvc,    cc: "",    cxx: "" }
    steps:
      - uses: actions/checkout@v4

      - name: 配置
        run: >
          cmake -B build
          -DMEANSORT_BUILD_TESTS=ON
          -DMEANSORT_BUILD_BENCH=ON
          -DMEANSORT_BUILD_BENCH_LEGACY=ON
          -DCMAKE_BUILD_TYPE=Release
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}

      - name: 编译
        run: cmake --build build --config Release --parallel

      - name: 测试
        run: ctest --test-dir build -C Release --output-on-failure

      - name: 断言计数（写进 job summary）
        shell: bash
        run: |
          # 测试二进制在末尾打印 CHECKS=N（ASCII 标记，便于抓取）
          out=$(ctest --test-dir build -C Release -V 2>&1 || true)
          echo "$out" | grep -E '^[0-9]+: (\[ OK \]|CHECKS=|全部通过)' | tail -n 40 || true
          n=$(echo "$out" | grep -oE 'CHECKS=[0-9]+' | tail -n 1 | cut -d= -f2)
          if [ -z "$n" ]; then n="?"; fi
          echo "### 测试结果" >> "$GITHUB_STEP_SUMMARY"
          echo "- 通过检查项：**$n**" >> "$GITHUB_STEP_SUMMARY"
          echo "- 平台：${{ matrix.os }} / ${{ matrix.compiler }}" >> "$GITHUB_STEP_SUMMARY"
          echo "CHECKS=$n"

      - name: 安装冒烟(确认装得出可被 find_package 使用的配置)
        shell: bash
        run: |
          cmake --install build --prefix stage --config Release
          cmake -E cat stage/lib/cmake/meansort/meansortConfig.cmake > /dev/null
          cmake -E cat stage/lib/cmake/meansort/meansortConfigVersion.cmake > /dev/null

      - name: 基准(2M,Unix)
        if: runner.os != 'Windows'
        run: |
          ./build/meansort_bench 2000000
          ./build/meansort_bench_legacy 2000000

      - name: 基准(2M,Windows)
        if: runner.os == 'Windows'
        run: |
          ./build/Release/meansort_bench.exe 2000000
          ./build/Release/meansort_bench_legacy.exe 2000000
